[package]
name = "grr-plugin"
version = "0.3.0"
edition = "2021"
authors = ["Archis Gore <me@archisgore.com>"]
description = "A Rust-based go-plugin implementation, to allow Rust plugins into Go programs."
readme = "README.md"
license = "Apache-2.0"
keywords = ["go-plugin", "golang", "hashicorp", "grpc"]
repository = "https://github.com/archisgore/grr-plugin"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
portpicker = "0.1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "fs"] }
log = "0.4"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http = "1.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
futures = "0.3.34"
prost = "0.14.5"
async-stream = "0.3.6"
triggered = "0.1.3"
gag = "1.0"
tokio-stream = "0.1.19"
async-recursion = "1.2.0"
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
assert_matches = "1.5.0"

[build-dependencies]
tonic-prost-build = "0.14.9"
